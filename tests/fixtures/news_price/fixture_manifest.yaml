# P2 news/price fixture manifest.
#
# This file is the answer key. Analysis code must never read it: `effects` states exactly
# what was injected, so any statistic that could see it would be marking its own homework.
# Only the fixture generator and the test assertions may load it.

manifest_version: "1.0.0"

clock:
  market: TEST_MARKET
  timezone: UTC
  interval_minutes: 30

baseline:
  start_at: "2026-01-05T00:00:00Z"
  weeks: 8
  base_level: 45.0
  daily_amplitude: 18.0
  weekly_amplitude: 6.0
  noise_scale: 4.0
  seed: 20260112

# Effects are absolute price offsets. Prices are allowed to reach zero and go negative
# during the renewable surplus, which is why nothing downstream may take a logarithm.
effects:
  - label: N01_generation_outage
    fixture_id: N01
    start_at: "2026-01-12T10:00:00Z"
    end_at: "2026-01-12T17:30:00Z"
    delta: 80.0
    volatility_multiplier: 1.6
  - label: N05_transmission_constraint
    fixture_id: N05
    start_at: "2026-01-20T09:00:00Z"
    end_at: "2026-01-20T15:00:00Z"
    delta: 45.0
    volatility_multiplier: 1.2
  - label: N06_demand_shock
    fixture_id: N06
    start_at: "2026-01-22T14:00:00Z"
    end_at: "2026-01-22T19:00:00Z"
    delta: 35.0
    volatility_multiplier: 1.1
  - label: N07_renewable_surplus
    fixture_id: N07
    start_at: "2026-01-25T00:00:00Z"
    end_at: "2026-01-25T12:00:00Z"
    delta: -70.0
    volatility_multiplier: 1.0

# Fixtures that must NOT produce a designed short-horizon effect. If any of these is ever
# reported as a stable event effect, the analysis is manufacturing results.
negative_controls:
  - fixture_id: N04
    reason: 恢复公告在停运效应结束之后发出，其窗口内不注入任何效应
  - fixture_id: N08
    reason: 2030 年的长期退役计划，生效时点落在价格序列之外
  - fixture_id: N09
    reason: 无关新闻，不应产生任何事件或价格效应
  - fixture_id: N10
    reason: 次日发布的回顾报道，尖峰时点尚不可用，不得进入当时的特征或解释

# What each fixture is expected to demonstrate on which time axis.
expected_outcomes:
  announcement_axis:
    N01: association_consistent_with_expected_direction
    N05: association_consistent_with_expected_direction
    N06: not_supported_by_current_data   # announced a day early; the effect is not in this window
  effective_axis:
    N01: association_consistent_with_expected_direction
    N05: association_consistent_with_expected_direction
    N06: association_consistent_with_expected_direction
    N07: association_consistent_with_expected_direction
