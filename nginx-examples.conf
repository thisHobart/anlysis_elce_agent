# ========================================
# Nginx 配置示例 - VPP Agent
# ========================================

# 示例 1: 使用服务器 IP 地址访问
# 访问地址: http://192.168.1.100/v1/query
# ========================================
server {
    listen 80;
    server_name 192.168.1.100;  # 你的服务器 IP

    access_log /var/log/nginx/vpp-agent-access.log;
    error_log /var/log/nginx/vpp-agent-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

# ========================================
# 示例 2: 使用域名访问
# 访问地址: http://vpp-api.yourcompany.com/v1/query
# ========================================
server {
    listen 80;
    server_name vpp-api.yourcompany.com;  # 你的域名

    access_log /var/log/nginx/vpp-agent-access.log;
    error_log /var/log/nginx/vpp-agent-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 只允许特定域名访问
        add_header 'Access-Control-Allow-Origin' 'http://yourcompany.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

# ========================================
# 示例 3: 使用子路径访问
# 访问地址: http://api.yourcompany.com/vpp/v1/query
# ========================================
server {
    listen 80;
    server_name api.yourcompany.com;

    access_log /var/log/nginx/api-access.log;
    error_log /var/log/nginx/api-error.log;

    # VPP Agent 在 /vpp 路径下
    location /vpp/ {
        # 去掉 /vpp 前缀，转发到后端
        rewrite ^/vpp/(.*) /$1 break;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # 健康检查
    location /vpp/health {
        rewrite ^/vpp/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # 其他服务可以在这里配置
    # location /other-service/ { ... }
}

# ========================================
# 示例 4: HTTPS 配置（推荐生产环境）
# 访问地址: https://vpp-api.yourcompany.com/v1/query
# ========================================
server {
    listen 443 ssl http2;
    server_name vpp-api.yourcompany.com;

    # SSL 证书（使用 certbot 自动生成）
    ssl_certificate /etc/letsencrypt/live/vpp-api.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpp-api.yourcompany.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/vpp-agent-ssl-access.log;
    error_log /var/log/nginx/vpp-agent-ssl-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        add_header 'Access-Control-Allow-Origin' 'https://yourcompany.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

# HTTP 自动跳转到 HTTPS
server {
    listen 80;
    server_name vpp-api.yourcompany.com;
    return 301 https://$server_name$request_uri;
}

# ========================================
# 示例 5: 内网环境（只允许特定 IP 访问）
# 访问地址: http://10.0.1.100/v1/query
# ========================================
server {
    listen 80;
    server_name 10.0.1.100;  # 内网 IP

    access_log /var/log/nginx/vpp-agent-access.log;
    error_log /var/log/nginx/vpp-agent-error.log;

    # IP 白名单
    allow 10.0.1.0/24;      # 允许 10.0.1.x 网段
    allow 192.168.1.0/24;   # 允许 192.168.1.x 网段
    deny all;               # 拒绝其他所有 IP

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 内网不需要 CORS
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

# ========================================
# 示例 6: 负载均衡（多个后端实例）
# 访问地址: http://vpp-lb.yourcompany.com/v1/query
# ========================================
upstream vpp_backend {
    # 负载均衡策略：轮询
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
    server 127.0.0.1:8003;

    # 可选：ip_hash（同一IP总是访问同一后端）
    # ip_hash;
}

server {
    listen 80;
    server_name vpp-lb.yourcompany.com;

    access_log /var/log/nginx/vpp-agent-lb-access.log;
    error_log /var/log/nginx/vpp-agent-lb-error.log;

    location / {
        proxy_pass http://vpp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}
