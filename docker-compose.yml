# Docker Compose 配置文件 - VPP Agent
version: '3.8'

services:
  vpp-agent:
    build: .
    container_name: vpp-agent
    ports:
      - "8000:8000"
    environment:
      - VPP_ENVIRONMENT=production
      - VPP_ALLOWED_ORIGINS=${VPP_ALLOWED_ORIGINS:-http://localhost:3000}
      - VPP_LLM_ENABLED=${VPP_LLM_ENABLED:-true}
      - VPP_LLM_BASE_URL=${VPP_LLM_BASE_URL}
      - VPP_LLM_API_KEY=${VPP_LLM_API_KEY}
      - VPP_LLM_MODEL=${VPP_LLM_MODEL}
      - VPP_DB_HOST=${VPP_DB_HOST}
      - VPP_DB_PORT=${VPP_DB_PORT}
      - VPP_DB_USER=${VPP_DB_USER}
      - VPP_DB_PASSWORD=${VPP_DB_PASSWORD}
      - VPP_DB_NAME=${VPP_DB_NAME}
      - VPP_QDRANT_HOST=${VPP_QDRANT_HOST:-qdrant}
      - VPP_QDRANT_PORT=${VPP_QDRANT_PORT:-6333}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - vpp-network
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vpp-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - vpp-network

  nginx:
    image: nginx:alpine
    container_name: vpp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - vpp-network
    depends_on:
      - vpp-agent

volumes:
  qdrant-storage:

networks:
  vpp-network:
    driver: bridge
