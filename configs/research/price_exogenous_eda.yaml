study:
  name: rt_price_exogenous_eda
  market: source_market_unspecified
  timezone: Asia/Shanghai
  frequency: 15min
  start_time: null
  end_time: null

target:
  name: rt_price
  path: ../../data/target_rt_price.csv
  timestamp_column: datetime
  value_column: rt_node_price_2B
  unit: unknown
  aggregation: mean
  availability_type: observed_only

