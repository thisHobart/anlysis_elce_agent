[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpp-langgraph-agent"
version = "0.1.0"
description = "A secure FastAPI and LangGraph scaffold for a virtual power plant agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langchain-openai>=0.3,<2.0",
  "langgraph>=0.2,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"
