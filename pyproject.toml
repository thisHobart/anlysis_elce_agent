[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-research-agent"
version = "0.1.0"
description = "A PySide6 desktop Agent for electricity-price and exogenous-variable research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-openai>=0.3,<2.0",
  "langgraph>=0.2,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pydantic-settings>=2.6,<3.0",
  # Price and exogenous-variable EDA
  "matplotlib>=3.8,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
  "pyarrow>=15.0,<24.0",
  "pyyaml>=6.0,<7.0",
  "scipy>=1.12,<2.0",
  "statsmodels>=0.14,<1.0",
  # Phase 1 desktop application
  "PySide6>=6.8,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]
build = ["pyinstaller>=6.22,<7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"
