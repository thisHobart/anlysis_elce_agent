protocol_id: electricity-price-evidence-ladder
version: "2.2.1"
kind: domain-evidence-ladder
objective: >-
  判定候选驱动变量能否进入电价预测特征集：按市场时钟、数据可用性、目标结构、驱动质量、
  关系稳定性、可预测性六层推进，每个变量最终归入可进入算法实验、仅可描述、
  存在泄漏风险或证据不足之一。
invariants:
  - 预测问题必须区分市场产品、预测起点、预测范围、时间粒度和市场时区；未知项保持未知。
  - availability_type 为 observed_only 或 unknown 的变量不得进入预测候选，只能形成描述性证据或泄漏风险提示。
  - availability_type 为 forecast 但 availability_timestamp_present 为 false 时，该变量的可获得性视为未验证。
  - 时间戳对齐必须保留时区与夏令时语义，不用行号近似市场时间。
  - 负价、价格上限附近值和尖峰默认保留；本阶段只识别和解释，不静默截尾、删除或插补。
  - 平稳性、季节分解和偏自相关需要连续序列，只在这些方法内部做时间插值并报告插值比例。
  - 正滞后固定表示 feature[t-lag] 与 price[t]，滞后范围受本地安全上限约束。
  - 相关、秩相关、互信息与 Granger 前置性都不得表述为因果关系，也不得表述为样本外预测增益。
  - 目标与驱动的平稳性 verdict 同时为 unit_root 时，同期相关按伪相关处理并须在一阶差分上重估。
  - 只选择回答当前研究问题所需的最小函数集合。
  - 每条假设都必须能被本轮选择的函数判定；写不出对应函数的猜想不得列入议程。
stop_conditions:
  - 目标序列不存在、时间轴不可解析或有效样本低于本地 EDA 门槛时停止关系研究。
  - 市场产品、预测起点或预测范围缺失且会改变可获得性判断时，标记限制并请求用户补充，而不是猜测。
  - 候选变量为 observed_only、可获得时点未知或发布时间晚于预测起点时，不把该变量提升为预测候选。
  - 成对有效样本低于门槛时缩小结论，不扩大函数或滞后扫描范围以制造关系证据。
  - 连续迭代没有新增证据或达到已评估 Iteration 上限时，交还用户决定，不自动重复同一方案。
stages:
  - stage_id: market_frame
    title: 市场任务与预测时钟
    objective: 明确被预测的市场产品、目标单位、时间粒度、时区、预测起点、预测范围和决策截止时点。
    functions: []
    function_rules: {}
    exit_gate: 关键字段已知或被明确记录为限制；不得用默认常识替代具体市场规则。

  - stage_id: data_readiness
    title: 数据质量与可获得性核验
    objective: 确认目标样本量足以支撑时序结论，并为每个变量定出可获得性资格。
    functions:
      - data_quality
    function_rules:
      data_quality: >-
        每个方案强制执行一次，由本地编译器加入。读三件事：目标有效样本是否支撑时序结论；
        每个变量的 availability_type 与 median_availability_lag_hours；覆盖缺口与重复时间戳的位置。
    exit_gate: >-
      目标满足最低 EDA 样本要求；有效样本不足两个完整日周期时不进入季节分解与偏自相关；
      每个变量都已定出候选资格，存在前视风险的变量不得成为预测候选。

  - stage_id: target_structure
    title: 电价结构、状态与记忆
    objective: 建立平稳性、季节强度、记忆阶数、波动状态和极端状态五项证据。
    functions:
      - price_descriptive_distribution
      - price_duration_curve
      - price_tukey_outer_fence
      - price_spike_regime_profile
      - price_calendar_group_profile
      - price_rolling_mean_std
      - price_stationarity_tests
      - price_seasonal_decomposition
      - price_lag_autocorrelation
      - price_partial_autocorrelation
      - price_segment_distribution_comparison
    function_rules:
      price_descriptive_distribution: >-
        目标首次进入研究范围时先做，为后续所有阈值提供量纲与分位基准。
        skewness 绝对值 ≥ 0.5 或 kurtosis（超额峰度）≥ 1.0 即认定明显偏斜或厚尾。
      price_duration_curve: >-
        需要量化高价时段集中度或收益结构时做。少数时段贡献大部分价格水平时，
        平均误差指标不足以刻画难度。
      price_tukey_outer_fence: 需要具体极端时点及其阈值时做；只标记，不删除。
      price_spike_regime_profile: >-
        需要判断尖峰是孤立还是成片时做。persistence_ratio 大于 1 表示聚集；
        concentration 指出风险时段；negative_share 非零时单独说明负价。
      price_calendar_group_profile: >-
        需要确认日内、周内或月度结构是否稳定时做。没有分解强度时，用分组自身的组间方差占比判断：
        某个分组解释了 ≥ 6% 的电价方差即认定存在该层结构。结果决定
        relationship_pearson_by_hour 与 relationship_pearson_by_month 是否有必要。
      price_rolling_mean_std: >-
        需要判断波动是否分阶段切换时做。rolling_statistics.one_day 的 maximum_std 与 minimum_std
        比值 ≥ 2 即认定分阶段；波动分段切换会让全样本相关结论失去代表性。
      price_stationarity_tests: >-
        任何基于水平值给出相关或趋势结论之前先做。verdict 为 unit_root 时关系证据须在一阶差分上重估；
        为 trend_or_break_suspected 时配合 trend_strength 或分段对比定位；
        为 inconclusive 时记为限制，不在两者中硬选一个。
      price_seasonal_decomposition: >-
        需要量化趋势与日周成分占比时做。seasonal_strength ≥ 0.6 为强周期结构，
        0.3–0.6 为中等，< 0.3 视为无稳定周期结构；variance_share.remainder 过半时结论降级。
      price_lag_autocorrelation: 需要整体持续性与日/周滞后衰减形状时做。
      price_partial_autocorrelation: >-
        需要自回归阶数或判断是否接近随机游走时做。取 suggested_autoregressive_order 与
        significance_band；一阶后即落入置信带说明接近随机游走。
      price_segment_distribution_comparison: >-
        用户明确给出子样本边界时做，一次 segments 调用覆盖全部子样本。
    exit_gate: >-
      平稳性 verdict、季节强度、记忆阶数、波动状态和极端状态五项各有结论或明确限制；
      不用单一汇总统计代表价格机制。

  - stage_id: driver_readiness
    title: 外生驱动质量与冗余
    objective: 确认每个候选驱动的量纲、覆盖、异常归因、漂移、冗余和自身平稳性。
    functions:
      - exogenous_descriptive_distribution
      - exogenous_iqr_outliers
      - exogenous_linear_index_trend
      - exogenous_stationarity_tests
      - exogenous_pearson_collinearity
      - exogenous_variance_inflation
    function_rules:
      exogenous_descriptive_distribution: >-
        任何变量首次进入研究范围先做，确认量纲与覆盖后再谈关系。
        coverage_rate < 90% 的变量不足以支撑关系分析。
      exogenous_iqr_outliers: >-
        关系可能被少数极端点主导时做。异常点先归因为传感异常、真实极端天气或单位错误，
        未归因的异常不得当作信号。
      exogenous_linear_index_trend: >-
        怀疑长期漂移或共同趋势混杂时做。漂移量级用 trend_slope_per_interval × observations 与该变量
        自身 std 比较，超过一个标准差才算长期漂移。显著漂移且目标同样非平稳时，同期相关先按共同趋势处置。
      exogenous_stationarity_tests: >-
        需要判断驱动自身是否存在单位根时做，与目标平稳性结论联合判读伪回归风险。
      exogenous_pearson_collinearity: 同时研究两个及以上候选驱动时做，识别两两冗余。
      exogenous_variance_inflation: >-
        两两相关不足以解释冗余、怀疑多变量共同解释时做；至少两个变量。
        severity 为 severe 的一组变量在特征建议中只保留一个代表。
    exit_gate: >-
      每个变量均有覆盖与可获得性结论；异常和趋势没有被误当作预测信号；冗余与非平稳变量已标记。

  - stage_id: relationship_evidence
    title: 电价与驱动关系证据
    objective: 在可获得性和样本门槛通过后，按线性、单调、非线性、滞后、前置性、稳定性逐层推进。
    functions:
      - relationship_scipy_pearson_pairwise
      - relationship_scipy_spearman_pairwise
      - relationship_mutual_information_scan
      - relationship_pearson_positive_lead_scan
      - relationship_granger_causality_scan
      - relationship_pearson_by_hour
      - relationship_pearson_by_month
      - relationship_feature_quartile_response
      - relationship_rolling_correlation_stability
      - relationship_pearson_segment_comparison
    function_rules:
      relationship_scipy_pearson_pairwise: 关系研究的第一步，|r| 低不等于结束。
      relationship_scipy_spearman_pairwise: >-
        Pearson 偏低且怀疑单调非线性或极端值主导时做。秩相关明显高于 Pearson 说明关系单调但非线性，
        或 Pearson 被少数极端点拉动。
      relationship_mutual_information_scan: >-
        线性与秩相关都低时做。以 nonlinearity_flagged 为准：归一化互信息须在最优滞后上高于
        同滞后的 absolute_pearson_at_best_lag，只有 lag 0 偏高不算。
      relationship_pearson_positive_lead_scan: >-
        出现候选关系后定位滞后。正滞后固定表示 feature[t-lag] 与 price[t]，不得使用未来实现值；
        最优滞后为 0 说明没有领先性，只能作同期特征且要求预测起点已有其预测值。
      relationship_granger_causality_scan: >-
        需要区分变量历史是否优于纯自回归基线时做，结论仅限样本内前置性。
      relationship_pearson_by_hour: 日历画像显示日内结构显著、需验证关系是否随交割小时变化时做。
      relationship_pearson_by_month: 需验证关系是否随月份或季节变化时做。
      relationship_feature_quartile_response: >-
        关注响应形状是否存在阈值或饱和时做。分位桶的 target_mean 不再单调即认定响应非线性；
        只描述形状，不作因果解释。
      relationship_rolling_correlation_stability: >-
        候选关系需验长期稳定性时做。stability 为 sign_unstable 时全样本相关不成立；
        为 magnitude_unstable 时只能写方向一致、强度随时间变化。
      relationship_pearson_segment_comparison: >-
        用户明确给出子样本边界时做，一次 segments 调用覆盖全部子样本。
    exit_gate: >-
      每个候选关系都说明方向、效应量、样本量、滞后语义和可获得性风险，
      且至少验证一项稳定性证据，否则只能表述为全样本平均关系。

  - stage_id: forecast_readiness
    title: 可预测性与建模就绪判定
    objective: 给出朴素基线误差底线与预处理建议，并对每个候选变量定级。
    functions:
      - price_variance_stabilization_check
      - price_naive_baseline_benchmark
    function_rules:
      price_variance_stabilization_check: >-
        目标厚尾明显或需要给出建模预处理建议时做。recommended_transform 为 asinh_median_mad 时，
        先给预处理结论再谈难度。
      price_naive_baseline_benchmark: >-
        需要后续模型的达标线时做。引用 best_baseline_label 与 best_mae 原值；
        near_zero_share ≥ 1% 时不得使用百分比误差指标。
    exit_gate: >-
      每个候选变量归入可进入算法实验、仅可描述、存在泄漏风险或证据不足之一；
      不以相关性直接批准特征，进入预测阶段前仍需时间顺序切分与样本外增量验证。
